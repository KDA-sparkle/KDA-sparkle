name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 */12 * * *"  # Toutes les 12 heures
  workflow_dispatch:

permissions:
  contents: write

# METRICS_TOKEN = Personal Access Token (classic, scopes : repo + read:user)
# Sans lui, seuls les repos publics sont comptés (donc presque que du CSS).
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # Carte principale : profil, activité, calendrier
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: KDA-sparkle
          template: classic
          base: header, activity, community, repositories
          config_timezone: Europe/Paris
          config_display: large
          filename: github-metrics.svg
          repositories_affiliations: owner
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # Carte langages : % calculé automatiquement sur tous les repos (privés inclus avec METRICS_TOKEN)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: KDA-sparkle
          template: classic
          base: ""
          config_timezone: Europe/Paris
          filename: metrics.languages.svg
          repositories_affiliations: owner
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_colors: github
          plugin_languages_skipped: KDA-sparkle, all-github-badge
