name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # Une fois par jour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: KDA-sparkle
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#ff4b8b
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff4b8b

      # Publié uniquement sur la branche output : plus de commit "🐍" sur main toutes les 12 h
      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
