  <path class="line"  d="M0 22H360L375 22L385 6L398 38L410 12L418 22H482L490 12L502 38L515 6L525 22H900"/>
  <g transform="translate(438 11) scale(2)"><path class="beat" fill="#ff1f5a" d="M0 3C0-1 6-1 6 3C6-1 12-1 12 3C12 7 6 10 6 12C6 10 0 7 0 3Z"/></g>
</svg>
