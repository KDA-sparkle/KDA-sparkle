<svg xmlns="http://www.w3.org/2000/svg" width="900" height="44" viewBox="0 0 900 44">
  <style>
    .line  { fill: none; stroke: #ff4b8b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
             stroke-dasharray: 1100; stroke-dashoffset: 1100; animation: draw 3.2s linear infinite; }
    .ghost { fill: none; stroke: #ff4b8b; stroke-opacity: .18; stroke-width: 2; stroke-linejoin: round; }
    @keyframes draw { 0% { stroke-dashoffset: 1100 } 70%,100% { stroke-dashoffset: 0 } }
    .beat  { transform-box: fill-box; transform-origin: center; animation: beat 1.2s infinite; }
    @keyframes beat { 0%,100% { transform: scale(1) } 15% { transform: scale(1.3) } 30% { transform: scale(1) } 45% { transform: scale(1.18) } }
  </style>
